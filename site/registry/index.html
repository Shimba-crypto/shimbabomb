<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registry — ShimbaBomb</title>
<link rel="icon" href="../logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#fbf7ee;--ink:#2b2a33;--ink-soft:#5a5866;--red:#e05252;--highlight:#ffe66d;--blue:#5b8def}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Patrick Hand',cursive;font-size:18px;line-height:1.6;color:var(--ink);background:var(--paper);background-image:linear-gradient(rgba(91,141,239,.10) 1px, transparent 1px);background-size:100% 34px;min-height:100vh}
.margin-line{position:fixed;top:0;bottom:0;left:64px;width:2px;background:rgba(224,82,82,.35);pointer-events:none;z-index:0}
@media(max-width:700px){.margin-line{left:28px}}
.wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:28px 24px 96px 96px}
@media(max-width:700px){.wrap{padding-left:48px}}
header{display:flex;gap:16px;align-items:center;margin:10px 0 8px}
.logo{width:54px;height:54px;transform:rotate(-4deg)}
h1{font-family:'Caveat',cursive;font-weight:700;font-size:52px;transform:rotate(-1.2deg)}
a{color:var(--ink);text-underline-offset:3px}
a:hover{color:var(--red)}
.top{font-family:'Caveat',cursive;font-size:18px;margin-bottom:14px}
.top a{text-decoration:none;border-bottom:2px solid var(--ink);padding-bottom:1px}
mark{background:linear-gradient(104deg,transparent 2%,var(--highlight) 6%,var(--highlight) 94%,transparent 98%);padding:0 6px;border-radius:4px}
.card{position:relative;background:#fff;padding:16px 18px 14px;margin:16px 0;box-shadow:2px 4px 10px rgba(43,42,51,.12);transform:rotate(-.5deg)}
.card.alt{transform:rotate(.5deg)}
.card::before{content:'';position:absolute;top:-11px;left:50%;transform:translateX(-50%) rotate(-2deg);width:84px;height:22px;background:rgba(255,230,109,.55);border-left:1px dashed rgba(43,42,51,.15);border-right:1px dashed rgba(43,42,51,.15)}
.card h3{font-family:'Caveat',cursive;font-size:24px;margin-bottom:6px}
.card p{color:var(--ink-soft)}
pre{font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.7;overflow-x:auto;white-space:pre}
.k{color:#5b8def}
#q{font-family:'JetBrains Mono',monospace;font-size:15px;width:100%;padding:10px 12px;border:2px solid var(--ink);border-radius:6px;background:#fff;color:var(--ink);margin:12px 0 4px}
footer{margin-top:64px;text-align:center;color:var(--ink-soft);font-family:'Caveat',cursive;font-size:20px;transform:rotate(-1deg)}
code{background:#fff;border:1px solid var(--ink);border-radius:6px;padding:1px 6px;font-family:'JetBrains Mono',monospace;font-size:14px}
.badge{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:12px;background:#eef4ff;border:1px solid var(--blue);border-radius:6px;padding:0 8px;margin-left:8px;vertical-align:middle}
</style>
</head>
<body>
<div class="margin-line"></div>
<div class="wrap">
<p class="top"><a href="../">← home</a> · <a href="../docs/">docs</a> · <a href="../std/">std</a> · <a href="https://github.com/Shimba-crypto/shimbabomb">github</a></p>
<header>
  <img class="logo" src="../logo.svg" alt="SB">
  <h1>registry <span style="color:var(--ink-soft);font-size:28px">— trusted libs</span></h1>
</header>
<p>every lib here is reviewed and ships with a sha256. install with <mark>sb -b &lt;name&gt;</mark>.</p>
<input id="q" type="search" placeholder="search libs… (e.g. bifi)" autocomplete="off">
<div id="cards"><p style="color:var(--ink-soft)">loading…</p></div>
<footer>
  publish yours: <code>sb publish</code> then open a PR touching <code>site/registry/</code>
</footer>
</div>
<script>
async function load() {
  const box = document.getElementById('cards');
  const q = document.getElementById('q');
  let idx = [];
  try {
    const r = await fetch('index.json', {cache: 'no-store'});
    idx = await r.json();
  } catch (e) {
    box.innerHTML = '<p style="color:var(--ink-soft)">registry unreachable. try again later.</p>';
    return;
  }
  function render(filter) {
    const f = (filter || '').toLowerCase();
    const rows = idx.filter(e =>
      !f || e.name.toLowerCase().includes(f) || (e.desc || '').toLowerCase().includes(f));
    if (!rows.length) {
      box.innerHTML = '<p style="color:var(--ink-soft)">no libs match “' +
        filter.replace(/</g, '&lt;') + '”. publish one with <code>sb publish</code>.</p>';
      return;
    }
    box.innerHTML = rows.map((e, i) =>
      '<div class="card' + (i % 2 ? ' alt' : '') + '">' +
      '<h3>' + e.name.replace(/</g, '&lt;') + '<span class="badge">v' +
      (e.latest || '?').replace(/</g, '&lt;') + '</span></h3>' +
      '<p>' + (e.desc || '').replace(/</g, '&lt;') + '</p>' +
      '<pre><span class="k">sb -b</span> ' + e.name.replace(/</g, '&lt;') +
      '\n<span class="k">pls bring</span> ' + e.name.replace(/</g, '&lt;') + '.</pre>' +
      '<a href="' + e.name.replace(/"/g, '%22') + '.json">manifest →</a></div>'
    ).join('');
  }
  q.addEventListener('input', () => render(q.value));
  render('');
}
load();
</script>
</body>
</html>
